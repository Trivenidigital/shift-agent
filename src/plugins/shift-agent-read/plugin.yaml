name: shift-agent-read
label: Shift Agent Reads
kind: standalone
version: 1.0.0
description: >
  Read-only Hermes tools over the agent's deterministic project data. Each tool
  owns its own authorization policy: get_compliance_deadlines is owner-only and
  resolves the caller through the existing identify-sender kernel;
  find_nearest_location is public and exposes only configured store locations.
  Hermes owns intent, clarification, reasoning and wording; these tools own
  authorization, validated reads, deterministic arithmetic and — where wrong
  facts would reach a customer — the exact outbound text.
author: Shift Agent
provides_tools:
  - get_compliance_deadlines
  - find_nearest_location
