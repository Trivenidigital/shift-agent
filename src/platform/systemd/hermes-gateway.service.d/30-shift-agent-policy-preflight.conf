# Shift Agent policy gate. Runs as the service user (no "+") AFTER the
# permissions guard, so it verifies exactly what the gateway will see.
#
# hermes_cli.plugins._load_plugin swallows exceptions from a plugin register(),
# and the bundled WhatsApp adapter keeps a deferred loader registered. So a
# silently-failed policy plugin would hand WhatsApp back to the stock,
# UNSCREENED adapter with no error. This preflight asserts the end state and
# fails the unit instead.
[Service]
ExecStartPre=/usr/local/bin/shift-agent-policy-preflight
