name: send-path-ci

# Isolated Linux pytest gate for the send-path surface (send-path-test-harness
# 2026-05-30). No live WhatsApp bridge exists on the runner, and the harness
# itself (conftest fake-sink default + safe_io LiveBridgeSendInTestError
# tripwire) guarantees no test can reach the live bridge. NO production secrets
# are used or required.

on:
  pull_request:
    paths:
      - "src/platform/**"
      - "src/agents/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/send-path-ci.yml"
  push:
    branches:
      - main
    paths:
      - "src/platform/**"
      - "src/agents/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/send-path-ci.yml"

concurrency:
  # `github.ref` is refs/heads/main for EVERY commit, so keying on it alone
  # made each merge cancel the gate still running for the merge before it —
  # 14 of send-path-ci's last 100 main-push runs ended `cancelled` that way,
  # leaving those SHAs with no completed result for a deploy or a bisect to
  # read. On push the group is the commit; on a pull_request it stays the
  # ref, so a superseded PR run is still cancelled.
  group: send-path-ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  send-path:
    name: send-path pytest (fake sink, no live bridge)
    runs-on: ubuntu-latest
    env:
      # Gate #3: CI defaults the bridge to a CLOSED loopback sink, never the
      # live bridge (:3000). The conftest autouse fixture also enforces this
      # per-test; setting it here makes the workflow-level default explicit.
      HERMES_BRIDGE_URL: "http://127.0.0.1:1/__fake_test_sink__"
      # Belt-and-suspenders: never opt into live bridge sends at the job level.
      # Tests that exercise the send path opt in per-test against a local stub.
      SHIFT_AGENT_ALLOW_BRIDGE_IN_TESTS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps (no project secrets)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pydantic pyyaml pytest

      - name: Pytest - non-Flyer root suite
        run: |
          mapfile -t TESTS < <(find tests -maxdepth 1 -type f -name 'test_*.py' ! -name 'test_flyer*' | sort)
          python -m pytest -q -p no:cacheprovider "${TESTS[@]}"

      # PR-R1: surface per-test collection/execution/PASSED lines for EVERY test
      # (incl. the 4 Linux-only ones that are skipped on the Windows dev box), the
      # module-provenance/binding diagnostic block, and the cross-store contention
      # winner/loser evidence — so the reviewer can read provenance + exactly-one-
      # durable-winner proof directly from the CI log. -s keeps prints unbuffered.
      - name: PR-R1 provenance + contention diagnostics (reviewer-mandated)
        run: python -m pytest tests/test_routing_invariants_r1.py -v -s

      - name: R2B-1 conflict-routing diagnostics (reviewer-mandated)
        # Individually named results for the R2B-1 evidence package: the full
        # 42-cell conflict-routing suite plus the two Linux-only dispatch cells
        # (exact production-canary replay; flag-off byte-identical behavior).
        run: |
          echo "branch HEAD=$(git rev-parse HEAD) merge-ref GITHUB_SHA=${GITHUB_SHA}"
          python -m pytest -vv tests/test_amendment_conflict_routing.py \
            "tests/test_cf_router_plugin.py::TestF7PrimaryMode::test_r2b1_conflict_canary_captures_amendment_flyer_arm_not_invoked" \
            "tests/test_cf_router_plugin.py::TestF7PrimaryMode::test_r2b1_flag_off_canary_is_byte_identical_flyer_revision"

      # Turn-arbitration (#646): named Linux PASSED evidence for the two UNCHANGED
      # branch-B tests (skipif-win32 — they execute ONLY on Linux, so this is where
      # their execution + pass becomes reviewable; the whole regression class was
      # a Windows skip hiding a Linux result) plus the unmocked end-to-end transcript
      # test. On Linux ALL are collected + PASS with ZERO skips.
      - name: Turn-arbitration branch-B + unmocked e2e diagnostics (reviewer-mandated)
        run: |
          echo "branch HEAD=$(git rev-parse HEAD) merge-ref GITHUB_SHA=${GITHUB_SHA}"
          python -m pytest -vv \
            "tests/test_cf_router_plugin.py::TestF7PrimaryMode::test_branch_b_active_lead_suppresses_with_canonical_reply" \
            "tests/test_cf_router_plugin.py::TestF7PrimaryMode::test_branch_b_active_lead_capture_failure_sends_retry_not_canonical" \
            tests/test_catering_turn_arbitration_e2e.py

      # ops/approval-lock-init: direct-execution evidence for the deploy-lock init
      # tests. Echo the checkout ref, then run every test individually (incl. the
      # extract-and-run, real-script-guard, and adversarial fd-interposition cases
      # that are Linux-only) so the reviewer can read PASSED lines + the fd-identity
      # evidence directly from the CI log. On Linux ALL are collected + PASS (none
      # skipped).
      - name: ops/approval-lock-init deploy-lock diagnostics (reviewer-mandated)
        run: |
          echo "branch HEAD=$(git rev-parse HEAD) merge-ref GITHUB_SHA=${GITHUB_SHA}"
          python -m pytest -vv tests/test_deploy_lock_init.py

      # ops/retired-template-removal: the dir_fd-anchored deletion evidence. On Linux
      # ALL cells COLLECT + PASS with ZERO skips (the extract-and-run cells are
      # skipif-win32; win32 is false here). The reviewer reads the parent-anchor
      # evidence line + the swapped-symlink target-survives + symlinked-parent-FATAL
      # PASSED lines directly from the CI log.
      - name: Retired-template removal diagnostics (reviewer-mandated)
        run: |
          echo "branch HEAD=$(git rev-parse HEAD) merge-ref GITHUB_SHA=${GITHUB_SHA}"
          python -m pytest -vv tests/test_deploy_retired_template.py

      # TTL-0 observe-only sweep (PR #633): the read-only-by-construction evidence.
      # Echo the checkout ref, then run the full suite — incident partition, the A1-A6
      # semantic pins, and the fail-closed AST no-write guard (module + CLI) — so the
      # reviewer reads the observe-only proof + PASSED lines directly from the CI log.
      - name: TTL-0 observe diagnostics (reviewer-mandated)
        run: |
          echo "branch HEAD=$(git rev-parse HEAD) merge-ref GITHUB_SHA=${GITHUB_SHA}"
          python -m pytest -vv tests/test_flyer_ttl0_observe.py

      # Deploy timer-state preservation (ops/deploy-preserve-timer-state): the
      # extract-and-run cells (enabled / disabled / missing-unit / query-failure /
      # start-failure / rollback / fail-before-activation) are Linux-only, so this
      # -vv step is where their individual PASSED lines become reviewable evidence.
      - name: Timer-state preservation diagnostics
        run: |
          echo "branch HEAD=$(git rev-parse HEAD) merge-ref GITHUB_SHA=${GITHUB_SHA}"
          python -m pytest -vv tests/test_deploy_timer_state_preservation.py

      # Deploy artifact->runtime closure (PR-2; F-8 / DGT-21): the extract-and-run
      # cells (stale-orphan / installer-refresh / missing-import / extra-orphan /
      # stale-import / clean / dotted-fallback / usage) are Linux-only (skipif-win32),
      # so they SKIP on the Windows dev box. This named -vv step runs them explicitly
      # on ubuntu so their individual PASSED lines are reviewable and a silent Linux
      # skip surfaces as a named result, not buried in the aggregate glob.
      - name: Deploy artifact-runtime closure diagnostics (reviewer-mandated)
        run: |
          echo "branch HEAD=$(git rev-parse HEAD) merge-ref GITHUB_SHA=${GITHUB_SHA}"
          python -m pytest -vv tests/test_deploy_artifact_runtime_closure.py

      # Transport-evidence harness: NAMED per-test Linux skip-closure evidence
      # (reviewer-mandated). The POSIX/symlink/fork/shell-gated tests are SKIPPED on
      # the Windows dev box but EXECUTE here; this -v step proves each required
      # platform-specific test actually ran on Linux — SO_PEERCRED, lifetime flock,
      # fork-only descriptor inheritance, SIGKILL ownership release, socket perms/
      # resilience, fsync durability, the five crash interruption windows, prior-epoch
      # reconciliation, and the deploy-gate functional matrix — so a silent Linux skip
      # surfaces as a named result, never buried in the aggregate glob.
      - name: Transport-evidence harness diagnostics (reviewer-mandated Linux skip-closure)
        run: |
          echo "branch HEAD=$(git rev-parse HEAD) merge-ref GITHUB_SHA=${GITHUB_SHA}"
          python -m pytest -v tests/test_transport_evidence_harness.py

      # Catering Studio E2E (M7): the full-lifecycle deterministic proof. The file
      # is ALSO collected by the aggregate glob above; this named -vv step exists so
      # each of the 17 ordered lifecycle cells reports its own PASSED line, and so a
      # Linux-only skip or failure surfaces BY NAME instead of being buried in the
      # glob's dot output. The reviewer reads the whole transcript here — qualified
      # lead, applied amendment, deterministic total, governed quote, follow-up,
      # STOP/takeover/release, acceptance, kill switch, per-lead hold, and the audit
      # timeline finale. This suite skips NOTHING on Linux.
      - name: Catering Studio E2E (M7) — full-lifecycle deterministic proof
        run: |
          echo "branch HEAD=$(git rev-parse HEAD) merge-ref GITHUB_SHA=${GITHUB_SHA}"
          python -m pytest -vv tests/test_catering_studio_e2e.py

  # ── deterministic catering lifecycle, as SUBPROCESSES ──────────────────────
  # A SEPARATE job, not another step of `send-path`, for one reason: the catering
  # scripts hardcode /opt/shift-agent and /usr/local/lib/hermes-agent/venv/bin/
  # python, and the test reproduces that layout as symlinks into its tmp_path
  # sandbox. That needs a writable /opt and /usr/local, which the unprivileged
  # runner user does not have — so this runs as root in a container. Same image
  # as the local repro recipe, so a red gate reproduces verbatim.
  #
  # This gate is NOT tests/e2e/test_catering_conversation_e2e.py: that one is the
  # funded real-OpenRouter conversation probe and skips without a key, which is
  # exactly why it is not counted as blocking coverage anywhere.
  catering-lifecycle-e2e:
    name: catering lifecycle E2E (real CLI chain, stub transport)
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim
    env:
      # Same posture as the send-path job: the bridge defaults to a CLOSED
      # loopback sink. The test points each subprocess at its own local stub.
      HERMES_BRIDGE_URL: "http://127.0.0.1:1/__fake_test_sink__"
      SHIFT_AGENT_ALLOW_BRIDGE_IN_TESTS: ""
      # A skip here would be a green gate that proved nothing. With this set, the
      # test's sandbox-unavailable path FAILS instead of skipping.
      CATERING_LIFECYCLE_E2E_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install test deps (no project secrets)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pydantic pyyaml pytest

      # -v so every lifecycle and refusal cell reports its own PASSED line, and
      # -rs so a skip is printed with its reason rather than left as a bare 's'.
      - name: Catering lifecycle E2E — inquiry to delivered quote, plus refusals
        run: python -m pytest -v -rs -p no:cacheprovider tests/e2e/test_catering_lifecycle_deterministic.py
