name: architecture-governance

# Governance-only gate. It reads docs/governance/ and the PR diff, and reports
# findings. It never deploys, never touches a VPS, never reads agent state and
# is never a runtime dependency — see docs/governance/engineering-directive.md
# §11 and the guard in tests/test_architecture_governance.py.
#
# Cost model:
#   - registry/structure integrity runs on EVERY pull request (cheap, and it is
#     the one check that must never be skipped — a broken registry breaks
#     classification for everyone);
#   - path-scoped checks (Capability Reuse Map, affected projects, exception
#     scope, new-subsystem heuristic) run against the actual changed files, so
#     an unrelated PR never pays for another product's rules.

on:
  pull_request:
    # `edited` is NOT in the default set (opened, synchronize, reopened), and
    # this gate's whole job is to read the PR BODY. Without it a body edit does
    # not re-run the check, so a green tick attests to the body as it was BEFORE
    # the edit — not the one being merged. Bodies are edited often here: 31 body
    # edits across the last 40 PRs, 14 of those PRs with at least one.
    #
    # Nothing shipped broken on the old trigger only because every pre-merge
    # edit happened to be followed by a push (`synchronize`) or a close+reopen
    # (`reopened`). That is luck, not a mechanism.
    #
    # `edited` also covers a base-branch change, which this gate cares about for
    # a second reason: it diffs against the base, so retargeting the PR changes
    # what the check is checking. It does NOT cover label changes — those are
    # `labeled`/`unlabeled`, and nothing here reads labels.
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
    paths:
      - "docs/governance/**"
      - "tools/check-architecture-governance.py"
      - "tests/test_architecture_governance.py"
      - ".github/workflows/architecture-governance.yml"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".cursor/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # `github.ref` is refs/heads/main for EVERY commit, so keying on it alone
  # made each merge cancel the gate still running for the merge before it —
  # 14 of send-path-ci's last 100 main-push runs ended `cancelled` that way,
  # leaving those SHAs with no completed result for a deploy or a bisect to
  # read. On push the group is the commit; on a pull_request it stays the
  # ref, so a superseded PR run is still cancelled.
  group: architecture-governance-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: registry integrity + path-scoped drift check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pyyaml pytest

      # Universal: always runs, for every PR, regardless of changed paths.
      - name: Registry + structure integrity
        run: python3 tools/check-architecture-governance.py --registry-only

      - name: Governance checker self-tests
        run: python3 -m pytest tests/test_architecture_governance.py -q

      # Workflow trigger-parity invariant. It lives here because this job is the
      # only one that runs on EVERY pull request regardless of changed paths —
      # and the change it polices is an edit to a workflow file, which does not
      # match send-path-ci's filter, the only other gate that executes
      # tests/test_repo_invariants.py. Without this step the invariant would
      # never run on its own change class.
      - name: Workflow trigger-parity invariant
        run: python3 -m pytest tests/test_repo_invariants.py -q

      # Path-scoped: only the affected projects' rules are evaluated.
      - name: Capture PR body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"

      # actions/checkout builds a MERGE COMMIT for pull_request events, so HEAD
      # is "this PR merged into current main". Diffing against
      # pull_request.base.sha would therefore also pick up everything that
      # landed on main after this PR branched, and attribute other people's
      # files to this PR. The base side of that merge (HEAD^1) is current main,
      # so HEAD^1...HEAD is exactly this PR's own changes. Fall back to
      # base.sha when HEAD is not a merge commit.
      - name: Resolve diff base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git rev-parse -q --verify HEAD^2 >/dev/null 2>&1; then
            resolved=$(git rev-parse HEAD^1)
            echo "HEAD is a merge commit; using its base parent $resolved"
          else
            resolved="$BASE_SHA"
            echo "HEAD is not a merge commit; using pull_request.base.sha $resolved"
          fi
          echo "DIFF_BASE=$resolved" >> "$GITHUB_ENV"

      - name: Path-scoped architecture drift check
        if: github.event_name == 'pull_request'
        run: |
          python3 tools/check-architecture-governance.py \
            --base "$DIFF_BASE" \
            --pr-body "$RUNNER_TEMP/pr-body.md"

      - name: Report affected projects
        if: always() && github.event_name == 'pull_request'
        run: |
          python3 tools/check-architecture-governance.py \
            --base "${DIFF_BASE:-${{ github.event.pull_request.base.sha }}}" \
            --format json > "$RUNNER_TEMP/governance.json" || true
          {
            echo "### Architecture governance"
            echo ""
            echo '```json'
            cat "$RUNNER_TEMP/governance.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
