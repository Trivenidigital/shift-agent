# Authoritative path-to-project classification for this monorepo.
#
# Read by tools/check-architecture-governance.py and by every dev session
# (root AGENTS.md step 1). Nothing here is a runtime dependency.
#
# CLASSIFICATION RULE — longest-literal-prefix wins.
#   A path pattern's "specificity" is the length of its literal prefix (the
#   characters before the first wildcard). For a changed file, the matching
#   pattern with the greatest specificity decides the owning project.
#   Example: `src/platform/catering_pricing.py` matches both
#   `src/platform/**` (shift-platform, specificity 14) and
#   `src/platform/catering_*` (catering-studio, specificity 22) — Catering
#   Studio owns it. Ownership follows the owner, not the directory.
#
#   Two patterns from different projects with EQUAL specificity that can match
#   a common path are an undeclared overlap and fail the checker unless listed
#   under `overlaps:` below.
#
# CONTAINER RULES vs PRODUCT RULES.
#   `tests/**` and `tools/**` (shift-platform) and `web/backend/**` +
#   `web/frontend/**` (cockpit) are CONTAINER rules: they exist so no path is
#   ever unclassified, NOT as a claim that shift-platform or the cockpit owns
#   everything inside them. Product-specific patterns are strictly more
#   specific and therefore always win. A product-owned test, fixture, tool or
#   cockpit panel MUST carry its own pattern under the owning project — being
#   swallowed by a container rule is a registry defect, not an acceptable
#   default. tests/test_architecture_governance.py enforces this: any file
#   whose path names a product but resolves to a container rule fails.
#
# UNKNOWN PATHS fail closed: a changed file matching no pattern is a
# classification error, not a silent pass. Add it to the owning project.

version: 1.0.0
updated: 2026-08-01

classification:
  rule: longest-literal-prefix-wins
  unclassified_policy: fail-closed
  # Path patterns must be repository-relative, POSIX-separated, contain no
  # absolute prefix, no `..`, no leading `./`, and no bare `**` catch-all.

# Discovery note: this repository contains 18 agents under src/agents/, one
# shared platform layer, one commerce layer, one operator cockpit, and the
# governance layer itself. Gecko Alpha is NOT present in this repository — it
