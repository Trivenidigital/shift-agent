# Declared overlaps — directories that host more than one project's files.
#
# Ownership inside an overlap is still resolved by longest-literal-prefix; the
# declaration records that the broader project's patterns deliberately span
# another project's files, so the checker does not read it as accidental. An
# entry authorizes nothing about architecture — it is a scope statement only.
overlaps:
  - id: OV-001
    projects:
      - cockpit
      - catering-studio
      - flyer-studio
      - commerce-platform
    paths:
      - web/backend/**
      - web/frontend/**
    resolution: longest-literal-prefix-wins
    reason: >-
      The cockpit is a container surface. Its broad web/backend and web/frontend
      patterns necessarily span the product panels mounted inside it — the
      catering, flyer and commerce routers and sections. Those specific paths
      are owned by their products and carry their products' directives; the
      cockpit directive governs the surrounding shell, auth and state access.

  - id: OV-002
    projects:
      - shift-platform
      - catering-studio
      - flyer-studio
      - commerce-platform
      - expense-bookkeeper
    paths:
      - src/platform/*.py
      - src/platform/scripts/**
    resolution: longest-literal-prefix-wins
    reason: >-
      Several product-specific modules physically live under src/platform/ —
      catering_*.py, flyer_*.py, commerce_*.py, qbo_client.py and the
      commerce-* scripts. The registry classifies them by owner rather than by
      directory, so governance treats them as product code. This is the
      standing deviation recorded in shared-platform-directive.md §3;
      relocating them is a future cleanup, not a governance prerequisite.

# Paths intentionally excluded from classification (binary/vendored artifacts
# that carry no architecture decisions). Kept explicit and narrow.
excluded:
  - web/frontend/package-lock.json
  - web/frontend/src/generated/**
  - "*.png"
  - "**/*.png"
